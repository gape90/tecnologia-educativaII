<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cápsulas Micro Learning · ECA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-noche:#061a4f; --azul:#0a3fb5; --celeste:#14a8ee; --cian:#5fd3ff; --naranja:#f7a21b;
    --texto:#14213d; --suave:#5d6b8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Montserrat",system-ui,sans-serif;color:#fff;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;overflow-x:hidden;
    background-color:var(--azul-noche);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(95,211,255,.28), transparent 32%),
      radial-gradient(circle at 92% 88%, rgba(20,168,238,.35), transparent 38%),
      radial-gradient(circle at 85% 12%, rgba(247,162,27,.18), transparent 22%),
      radial-gradient(rgba(255,255,255,.10) 1.2px, transparent 1.4px),
      linear-gradient(135deg, #061a4f 0%, #0a2f8f 55%, #0b4fc4 100%);
    background-size:auto,auto,auto,22px 22px,auto;
    background-attachment:fixed;
  }
  body::before, body::after{content:"";position:fixed;z-index:0;pointer-events:none}
  body::before{width:46px;height:46px;left:3vw;bottom:8vh;border-radius:18px;background:linear-gradient(135deg,var(--cian),var(--celeste));opacity:.55;transform:rotate(8deg)}
  body::after{display:none}

  .marca{position:fixed;top:14px;right:20px;z-index:2;pointer-events:none}
  .marca img{height:64px;width:auto;display:block;
    filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 0 10px rgba(255,255,255,.28)) drop-shadow(0 4px 12px rgba(0,0,0,.25))}
  @media (max-width:560px){ .marca{top:10px;right:12px} .marca img{height:40px} }

  main{position:relative;z-index:1;width:min(1180px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}

  .sello{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 18px 8px 8px;border-radius:999px;
    background:linear-gradient(90deg,var(--naranja) 0 6px, var(--azul) 6px, var(--celeste));
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    font-weight:800;letter-spacing:.4px;text-transform:uppercase;font-size:clamp(.85rem,2vw,1rem);
  }
  .sello svg{margin-left:6px}
  h1{
    margin:16px 0 8px;font-weight:800;line-height:1.1;
    font-size:clamp(1.8rem,4.4vw,3rem);letter-spacing:-.5px;
  }
  h1 span{display:block;background:linear-gradient(90deg,var(--cian),#fff 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bajada{margin:0 auto;max-width:620px;color:rgba(255,255,255,.82);font-size:clamp(.95rem,2vw,1.08rem);line-height:1.55;font-weight:500}
  .linea{width:180px;height:6px;border-radius:99px;margin:16px auto 24px;background:linear-gradient(90deg,var(--azul),var(--celeste) 70%,#c9d3e6 70% 80%,var(--naranja) 80%)}

  .contenido{
    display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);
    gap:28px;align-items:center;
    width:min(100%, calc((100vh - 310px) * 2.95));min-width:min(100%,760px);
  }
  .marco-video{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    background:#050f33;
    box-shadow:0 18px 50px rgba(0,8,40,.45), 0 0 0 1px rgba(255,255,255,.18);
  }
  .marco-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sin-video{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-weight:600;font-size:.95rem}
  .modulos{display:flex;flex-direction:column;align-items:stretch;gap:14px;width:100%}
  .pildora{
    position:relative;display:flex;align-items:center;gap:18px;
    width:100%;height:66px;padding:0 24px 0 0;
    border-radius:999px;text-decoration:none;color:#fff;
    background:linear-gradient(90deg,#071e66 0%,#0a3fb5 45%,#139fe9 85%,#29c4ff 100%);
    box-shadow:0 10px 26px rgba(0,8,40,.45);
    overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, filter .2s;
  }
  /* borde naranja a la izquierda, como en las carátulas */
  .pildora::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:30px;
    background:linear-gradient(90deg,#ffb128,#f46d1b);
  }
  .pildora .icono{
    position:relative;z-index:1;flex:none;display:flex;align-items:center;justify-content:center;
    width:92px;height:100%;margin-left:16px;border-radius:999px 0 0 999px;
    background:linear-gradient(90deg,#f0751d 0%,#9a3a35 35%,#071e66 100%);
  }
  .pildora .divisor{flex:none;width:2px;height:40px;background:rgba(255,255,255,.85);border-radius:2px}
  .pildora .texto{flex:1;text-align:left;font-weight:800;font-size:clamp(1rem,2.4vw,1.2rem);letter-spacing:.6px;text-transform:uppercase}
  .pildora .flecha{font-size:1.5rem;font-weight:700;opacity:.85;transition:transform .2s}
  .pildora:hover{transform:translateY(-3px);filter:brightness(1.07);box-shadow:0 16px 34px rgba(0,8,40,.55), 0 0 0 2px var(--cian)}
  .pildora:hover .flecha{transform:translateX(4px)}
  .pildora:focus-visible{outline:3px solid var(--naranja);outline-offset:4px}
  .pildora .icono{width:80px}

  /* Cápsulas aún no disponibles */
  .pildora.deshabilitada{
    cursor:not-allowed;color:rgba(255,255,255,.55);
    background:linear-gradient(90deg,#3b4254 0%,#596178 60%,#6f778c 100%);
    box-shadow:0 6px 16px rgba(0,8,40,.3);
  }
  .pildora.deshabilitada::before{background:linear-gradient(90deg,#8a8f9c,#6c7280)}
  .pildora.deshabilitada .icono{background:linear-gradient(90deg,#6c7280 0%,#4a5163 40%,#3b4254 100%)}
  .pildora.deshabilitada .icono svg{opacity:.55}
  .pildora.deshabilitada .divisor{background:rgba(255,255,255,.35)}
  .pildora.deshabilitada .flecha{opacity:.7;display:flex}
  .pildora.deshabilitada:hover{transform:none;filter:none;box-shadow:0 6px 16px rgba(0,8,40,.3)}
  .pildora.deshabilitada:hover .flecha{transform:none}

  @media (max-width:860px){
    .contenido{grid-template-columns:1fr;gap:22px;width:100%;min-width:0;max-width:560px;margin:0 auto}
  }
  @media (max-width:420px){
    .pildora{height:64px;gap:12px;padding-right:18px}
    .pildora .icono{width:70px;margin-left:12px}
    .pildora .icono svg{width:28px;height:28px}
    .pildora::before{width:22px}
  }
</style>
</head>

  <script>
    /* Pegá acá el link de YouTube del video de presentación */
    const VIDEO_INICIO = "https://youtu.be/-O8t2FY4pfI";

    (function(){
      const m = String(VIDEO_INICIO).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
      const id = m ? m[1] : VIDEO_INICIO.trim();
      const caja = document.getElementById("video");
      if (!/^[\w-]{11}$/.test(id) || id === "XXXXXXXXXXX"){
        caja.innerHTML = '<div class="sin-video">Falta cargar el link del video</div>';
        return;
      }
      const origen = location.protocol.startsWith("http") ? "&origin=" + encodeURIComponent(location.origin) : "";
      caja.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1&playsinline=1' + origen +
        '" title="Video de presentación" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    })();
